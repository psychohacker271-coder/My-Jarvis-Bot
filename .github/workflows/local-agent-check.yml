name: Local agent runtime checks

on:
  push:
    branches: [nexora-project-docs]
  pull_request:
    branches: [nexora-project-docs]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Compile local brain and agent runtime
        run: python -m compileall -q nexora_local_brain.py nexora_agents.py
      - name: Run agent runtime tests
        run: python -m unittest discover -s tests -v
